server:
  port: 8080
spring:
  application:
    name: northstar-crm-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/northstar_crm?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-please-change-this-32-bytes-minimum}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
app:
  cors-origin: ${APP_CORS_ORIGIN:http://localhost:5173}
